<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Session workflow">
  <rect width="1100" height="420" fill="#0a0614"/>
  <text x="40" y="44" fill="#ff2bd6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Session workflow</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8f7ff">
    <rect x="40" y="80" width="240" height="120" rx="10" fill="#141022" stroke="#00f0ff"/>
    <text x="160" y="128" text-anchor="middle">1. First use / mods changed?</text>
    <text x="160" y="156" text-anchor="middle" fill="#8ad4e8">Run discovery script</text>
    <rect x="320" y="80" width="240" height="120" rx="10" fill="#141022" stroke="#00f0ff"/>
    <text x="440" y="128" text-anchor="middle">2. OS + date + inventory</text>
    <text x="440" y="156" text-anchor="middle" fill="#8ad4e8">Hash vs last snapshot</text>
    <rect x="600" y="80" width="240" height="120" rx="10" fill="#141022" stroke="#ff2bd6"/>
    <text x="720" y="128" text-anchor="middle">3. Nexus if needed</text>
    <text x="720" y="156" text-anchor="middle" fill="#8ad4e8">Updates + relevant posts</text>
    <rect x="860" y="80" width="200" height="120" rx="10" fill="#141022" stroke="#ff2bd6"/>
    <text x="960" y="128" text-anchor="middle">4. Answer the ask</text>
    <text x="960" y="156" text-anchor="middle" fill="#8ad4e8">Quest / map / CET</text>
    <rect x="40" y="260" width="1020" height="110" rx="10" fill="#141022" stroke="#00f0ff"/>
    <text x="550" y="310" text-anchor="middle">Follow-ups in the same conversation skip Nexus unless the inventory hash changes or the user says they added mods.</text>
    <text x="550" y="338" text-anchor="middle" fill="#8ad4e8">CET snippets are looked up on the current wiki for this patch — not memorized.</text>
  </g>
</svg>
